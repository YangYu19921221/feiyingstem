# SRS 直播源站配置 —— 线上授课用
#
# 本文件本地测试和生产服务器**通用**,唯一差别是生产前面套一层 Nginx 做 HTTPS 终结
# (WHIP 浏览器推流要求 HTTPS,本地 localhost 例外可以免证书)。
#
# 关键取舍:
# - **不转码**。转码会把 CPU 从 5% 拉到 100%,而教学直播没有多码率需求
#   (学生端网络差就降清晰度这件事,交给 CDN 或直接推低码率解决)。
# - hls_fragment 1s + window 5s:延迟换成 3~5 秒但兼容 iOS Safari。
#   要低延迟的走 FLV/WebRTC,HLS 只是兜底。
listen              1935;
max_connections     200;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

rtc_server {
    enabled         on;
    listen          8000;
    # 本地测试填 127.0.0.1;部署到服务器改成服务器公网 IP,
    # 否则浏览器拿到的 ICE candidate 是容器内网地址,连不上 → 一直转圈
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    # WHIP 推流(老师网页一键开播,RFC 9725)
    rtc {
        enabled     on;
        # 让 WebRTC 推的流能被 FLV/HLS 拉 —— 老师用 WHIP 推,学生用 FLV 看,靠这个转
        rtc_to_rtmp on;
        rtmp_to_rtc on;
    }

    # HTTP-FLV 播放:延迟 1~3 秒,Chrome/Android 首选
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS 播放:iOS Safari 必需(Safari 不支持 MSE 播 FLV)
    hls {
        enabled         on;
        hls_fragment    1;
        hls_window      5;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        # 老师下课后清掉切片,不留一堆 ts 占盘
        hls_cleanup     on;
        hls_dispose     30;
    }

    # 录制回放。**录制的原始文件不直接给学生** ——
    # 要先过 FFmpeg 烧「飞鹰教育」水印(见 watermark_service.ffmpeg_watermark_args)
    dvr {
        enabled     off;
        dvr_path    ./objs/nginx/html/recordings/[app]/[stream].[timestamp].flv;
        dvr_plan    session;
    }
}
