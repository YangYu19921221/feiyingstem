# 英语助手后端的两组上游(http 级;放 /www/server/panel/vhost/nginx/,文件名以 0. 开头与 0.websocket.conf 同排)
# eh_workers: 工作进程池(english-helper-workers,8001)。8000 是 backup —— 工作进程服务停了 / 起不来时
#             nginx 连不上 8001 就自动全走主进程 = 回到原来的单进程,不用改 nginx
# eh_main:    主进程(english-helper,8000)。PK / 竞赛 / 直播弹幕 / 宠物对战 / 语音模型等只能在这里
upstream eh_workers {
    server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8000 backup;
    keepalive 32;
}

upstream eh_main {
    server 127.0.0.1:8000;
}
