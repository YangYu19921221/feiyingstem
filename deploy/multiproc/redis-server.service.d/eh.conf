# 英语助手后端多进程用(2026-10-25): 只放限流/验证码/在线状态等带过期时间的小数据,不落盘、限 256MB
# 2025-10-22 起起不来的原因: /usr/local/lib 里另装了一份 libjemalloc.so.2,动态链接优先加载它,
# 而本单元沙箱(NoExecPaths=/ + ExecPaths=/usr/lib)不许从 /usr/local/lib 映射可执行段 → exit 127。
# 这里只对 Redis 指定系统包自带的那份,不改全局 ldconfig(别的程序可能在用 /usr/local/lib 那份)
[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu
ExecStart=
ExecStart=/usr/bin/redis-server /etc/redis/redis.conf --supervised systemd --daemonize no --maxmemory 256mb --maxmemory-policy volatile-lru --save ""
